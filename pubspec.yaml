name: my_holidays
description: "MyHolidays - Holiday & vacation planner"
publish_to: 'none'
version: 1.0.1+8

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.7.0
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  archive: ^4.0.2
  in_app_purchase: ^3.2.0
  share_plus: ^10.1.4
  open_file: ^3.5.11
  printing: ^5.14.2
  pdf: ^3.11.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.3
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/holiday-icon.png
    - assets/images/holiday-watermark.png
    - assets/icons/
